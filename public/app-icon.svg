<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/>
      <stop offset="1" stop-color="#5bb8f0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- soft clouds -->
  <ellipse cx="96" cy="118" rx="52" ry="20" fill="#fff" opacity=".45"/>
  <ellipse cx="426" cy="160" rx="44" ry="16" fill="#fff" opacity=".4"/>
  <!-- back hair (long) -->
  <path d="M136 230 C128 110 384 110 376 230 L392 420 C340 440 172 440 120 420 Z" fill="#1d1a22"/>
  <!-- body / orange clothes -->
  <path d="M96 512 C100 430 168 392 256 392 C344 392 412 430 416 512 Z" fill="#ff8a2a"/>
  <path d="M96 512 C100 452 130 420 170 404 L180 512 Z" fill="#f2761a" opacity=".6"/>
  <path d="M416 512 C412 452 382 420 342 404 L332 512 Z" fill="#f2761a" opacity=".6"/>
  <!-- collar -->
  <path d="M212 394 L256 432 L300 394" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- neck -->
  <rect x="226" y="330" width="60" height="70" rx="18" fill="#fde3cf"/>
  <path d="M226 340 Q256 362 286 340 L286 352 Q256 372 226 352 Z" fill="#efc3a6" opacity=".8"/>
  <!-- front long locks over shoulders -->
  <path d="M146 236 C128 320 128 420 140 500 L158 470 L170 504 L188 470 C178 400 174 320 182 250 Z" fill="#1d1a22"/>
  <path d="M366 236 C384 320 384 420 372 500 L354 470 L342 504 L324 470 C334 400 338 320 330 250 Z" fill="#1d1a22"/>
  <!-- ears -->
  <ellipse cx="160" cy="250" rx="18" ry="24" fill="#fde3cf"/>
  <ellipse cx="352" cy="250" rx="18" ry="24" fill="#fde3cf"/>
  <!-- face -->
  <ellipse cx="256" cy="238" rx="98" ry="108" fill="#fde3cf"/>
  <!-- bangs -->
  <path d="M152 226 C146 140 200 112 256 112 C312 112 366 140 360 226
           C352 206 344 190 336 180 C332 200 322 212 312 220
           C306 198 298 184 288 174 C282 196 270 210 256 216
           C244 204 234 190 228 172 C218 186 208 202 202 222
           C192 210 184 196 178 178 C170 192 160 208 152 226 Z" fill="#1d1a22"/>
  <!-- hair shine -->
  <path d="M196 140 C226 124 290 122 318 138" fill="none" stroke="#5b5566" stroke-width="7" stroke-linecap="round" opacity=".8"/>
  <!-- brows -->
  <path d="M196 224 Q214 214 232 222" fill="none" stroke="#3a2e33" stroke-width="5" stroke-linecap="round"/>
  <path d="M280 222 Q298 214 316 224" fill="none" stroke="#3a2e33" stroke-width="5" stroke-linecap="round"/>
  <!-- round eyes -->
  <g>
    <ellipse cx="214" cy="256" rx="20" ry="24" fill="#2b1d16"/>
    <ellipse cx="214" cy="264" rx="13" ry="14" fill="#5a3a26"/>
    <circle cx="206" cy="245" r="8" fill="#fff"/>
    <circle cx="221" cy="268" r="3.5" fill="#fff"/>
  </g>
  <g>
    <ellipse cx="298" cy="256" rx="20" ry="24" fill="#2b1d16"/>
    <ellipse cx="298" cy="264" rx="13" ry="14" fill="#5a3a26"/>
    <circle cx="290" cy="245" r="8" fill="#fff"/>
    <circle cx="305" cy="268" r="3.5" fill="#fff"/>
  </g>
  <!-- blush -->
  <ellipse cx="190" cy="294" rx="20" ry="10" fill="#ff7f9a" opacity=".45"/>
  <ellipse cx="322" cy="294" rx="20" ry="10" fill="#ff7f9a" opacity=".45"/>
  <!-- nose -->
  <path d="M256 284 L253 290" stroke="#c98a6c" stroke-width="4" stroke-linecap="round"/>
  <!-- smiling mouth -->
  <path d="M226 302 Q256 346 286 302 Q256 312 226 302 Z" fill="#b8323f"/>
  <path d="M240 320 Q256 336 272 320 Q256 314 240 320 Z" fill="#ff8f9c"/>
</svg>
